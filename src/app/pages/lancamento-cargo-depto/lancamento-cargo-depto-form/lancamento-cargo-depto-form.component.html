<!-- Inicio Breadcamb Inicio BreadcambInicio BreadcambInicio BreadcambInicio BreadcambInicio BreadcambInicio Breadcamb-->
<section class="main-content">
  <div class=" page-header">
    <ng-container style="height: 100;">
      <div class="row ">
        <div class="col-md-12">
          <i class="fas fa-home f-26 text-dark"></i>   <span class="text-muted" style="font-size: 20px;">{{
            nomeIgreja }}</span>
          <div class="row ">
            <div class="col-md-12">
              <div class="flex">
                <div class="row">
                  <nav aria-label="breadcrumb mb-0">
                    <ol class="breadcrumb mb-0">
                      <li class="breadcrumb-item active"><a>Home</a></li>
                      <li class="breadcrumb-item active"><a>Cargos Departamentais</a></li>
                      <li class="breadcrumb-item active"><a>Lançamentos</a></li>
                    </ol>
                    <hr class="mt-1 mb-0">
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div><br>
    </ng-container>
    <!-- fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb fim Breadcamb -->
    <!-- Inicio Botões-->
    <div class="card-header">
      <ng-container style="height: 100;">
        <div class="row ">
          <div class="col-md-12">
            <div class="row">
              <!-- Botões Inicio-->
              <div class="">
                <span class="float-end  mb-2 ">
                  @if(currentAction !== 'new'){
                  <p-button type="button" (click)="exclusaoLancamentoCargoDepto(cargoDepto)"
                    [style]="{'height':'30px', 'margin-left':'10px'}" size="small" icon='pi pi-times' variant="outlined"
                    severity="danger" label="Excluir" class="" />
                  }
                </span>

                <span class="float-end mb-2 ml-4">
                  <p-button (click)="submitForm()" severity="success"
                    [disabled]="submittingForm || lancamentoCargoDeptoForm.invalid" type="submit" class="mr-4"
                    [style]="{'height':'30px', 'margin-left':'10px', 'background':'#388669'}" size="small"
                    label="Salvar" icon='pi pi-check' />
                </span>

                <span class="float-end mb-2">
                  <p-button routerLink="/lancamentocargodeptos" icon='pi pi-chevron-left'
                    [style]="{'height':'30px', 'margin-left':'10px'}" size="small" severity="info" label="voltar"
                    class=" mt-0" label="Voltar" />
                </span>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
    <!-- Fim botões -->


    <form [formGroup]="lancamentoCargoDeptoForm" autocomplete="off" (submit)="submitForm()">
      <div class="col-sm-12">
        <div class=" py-3 pt-0 px-0 ">
          <div class="col-sm-12">
            <div class="card py-3 shadow pt-0  ">
              <nav aria-label="breadcrumb" class=" mb-4">
                <div class="card mb-0 p-3 py-1  " style="background-color: rgb(77, 83, 90); border-radius: 5px">
                  <span class=" text-white py-0 " style="font-size: 18px; ">{{ pageTitle
                    }}</span>
                </div>
              </nav>
              <div class="row px-3">
                <!-- codigo -->
                <div class="form-group col-md-2">
                  <label>Código</label>
                  <input readonly type="text" class="form-control" formControlName="id">
                </div>

                <!-- departamentoId -->
                <div class="form-group col-md-6">
                  <label>Departamento</label>
                  <p-select [style]="{'width':'100%','height':'35px'}" class="w-full md  mb-2"
                    formControlName="departamentoId" [options]="departamentos" [editable]="false" [filter]="false"
                    filterBy="nome" [showClear]="false" optionLabel="nome" resetFilterOnHide="true"
                    dropdownIcon="pi pi-chevron-down" [autofocus]="false" optionValue="id" placeholder=""
                    (onChange)="selectNomeDepartamento($event)">
                  </p-select>
                </div>

                <div class="col-md-4"></div>
              </div>

              <div class="row px-3">

                <!-- membro -->
                <div class="form-group col-md-5">
                  <label>Membro</label>
                  <p-select [style]="{'width':'100%','height':'35px'}" class="w-full md  mb-2"
                    formControlName="pessoaId" [options]="pessoas" [editable]="false" [filter]="true" filterBy="nome"
                    [showClear]="false" optionLabel="nome" resetFilterOnHide="true" dropdownIcon="pi pi-user"
                    [autofocus]="false" optionValue="id" placeholder="" (onChange)="selectNomePessoa($event)">
                  </p-select>
                </div>

                <!-- cargo -->
                <div class="form-group col-md-3">
                  <label>Cargo Função</label>
                  <p-select [style]="{'width':'100%','height':'35px'}" class="w-full md  mb-2" formControlName="cargoId"
                    [options]="cargos" [editable]="false" [filter]="true" filterBy="nome" [showClear]="false"
                    optionLabel="nome" resetFilterOnHide="true" dropdownIcon="pi pi-chevron-down" [autofocus]="false"
                    optionValue="id" placeholder="" (onChange)="selectNomeCargo($event)">
                  </p-select>
                </div>
                <div class="col-md-4"></div>

              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- <div class="row ">
            <div class="form-group ">
                <pre> {{cargoDeptoForm.value | json}} </pre><br>
            </div>
        </div> -->
    </form>
  </div>
</section>
