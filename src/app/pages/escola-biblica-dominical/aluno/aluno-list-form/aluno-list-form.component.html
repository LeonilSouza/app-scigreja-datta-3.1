<!-- Cards Estaticticas -->
<section class="main-content">
    <div class="row mb-0 ">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="card card-border-c-red border-1  ">
                <div class="row align-items-center m-l-0">
                    <div class="col-auto">
                        <i class="fas fa-book-reader f-28 text-primary"></i>
                    </div>
                    <div class="col-auto">
                        <h6 class="text-dark mt-2">Total por Classe</h6>
                        <h4 class="f-16"> {{ totalRegistros }} </h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Fim Cards Estaticticas -->


    <div class="row mb-2">
        <!-- Nome Classe-->
        <span class="col-sm-4 ">
            <p-floatlabel variant="on">
                <span class=" col-sm-4 mt-0 mb-2">
                    <p-select style="min-height: 35px;" inputId=" on_label" (onChange)="onChangeSelecaoClasses($event)"
                        [options]="classes" [editable]="false" [filter]="true" filterBy="nome" [showClear]="false"
                        optionLabel="nome" resetFilterOnHide="true" class="" dropdownIcon="pi pi-users" optionValue="id"
                        [autofocus]="false" />
                    <label class="" for="on_label">Classes</label>
                </span>
            </p-floatlabel>
        </span>

        <!--Label  -->
        <span class="col-sm-3 "><strong>
                <label class="text-c-purple f-18" [style]="{'height':'35px'}" size="small" icon="pi pi-check">{{
                    nomeClasse }}</label>
            </strong></span>

        <!-- Pesquisa alunos -->
        <span class=" col-sm-3 mt-0 mb-2">
            <p-inputgroup>
                <button type="button" style="height: 30px; cursor:default ; border-radius: 6px; border-bottom-right-radius:0;
               border-top-right-radius: 0; border: 0; background:#1a82ce;" pButton pRipple class=""> <i
                        class="pi pi-search"></i></button>
                <input pInputText class="form-control " placeholder="Pesquisar " [(ngModel)]="nome" type="text"
                    [ngModelOptions]="{standalone: true}"
                    (input)="dtaluno.filterGlobal($event.target?.addEventListener, 'contains')" style="height: 30px; min-width: 180px; border-radius: 6px; border-bottom-left-radius: 0; 
              border-top-left-radius: 0; font-size: 14px; text-transform: lowercase">
            </p-inputgroup>
        </span>

        <!--Novo  -->
        <span class="col-sm-2 ">
            <p-button (click)="imodo=0; modalAluno.show(); loadAluno(aluno)" type="button" severity="success"
                class="float-end" label="Novo" [style]="{'height':'30px', 'background':'#388669'}" size="small"
                icon="pi pi-check" />
        </span>

    </div>
    <app-card [hidHeader]="true" cardTitle="" cardClass="card-border-c-purple shadow  border-1">
        <div class="p-0">
            <p-table #dtaluno [value]="alunos"
                [globalFilterFields]="['nome', 'country.name', 'representative.name', 'status']" [lazy]="true"
                responsiveLayout="stack" (onLazyLoad)="loadAlunosLazy($event)" [showCurrentPageReport]="true"
                [totalRecords]="totalRegistros" showGridlines stripedRows
                currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros" [paginator]="true"
                [rows]="linesPerPage" emptyMessage="Nenhum registro encontrado">


                <ng-template #header>
                    <tr>
                        <th class="col-data-content-5"
                            style=" background-color:rgb(77, 83, 90); font-size: 13px ; color: aliceblue; padding-top: 6px; padding-bottom: 6px;">
                            <b>Nome</b>
                        </th>
                        <th class="f-12 col-data-content-4"
                            style=" background-color:rgb(77, 83, 90); font-size: 13px ; color: aliceblue; padding-top: 6px; padding-bottom: 6px;">
                            <b>Classe</b>
                        </th>
                        <th class="col-data-content"
                            style=" background-color:rgb(77, 83, 90); font-size: 13px ; color: aliceblue; padding-top: 6px; padding-bottom: 6px;">
                            <b>Classificação</b>
                        </th>

                        <th class="col-acoes-header"
                            style="font-size: 13px; background-color: rgb(77, 83, 90); color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-right-radius: 5px;">
                            Ações</th>

                    </tr>
                </ng-template>

                <ng-template #body let-aluno>
                    <tr>
                        <td class="col-data-content-5 py-1" style=" font-size: 13px">{{ aluno.nome
                            }}</td>
                        <td class="col-data-content-4 py-1" style=" font-size: 13px">{{ aluno.classe }}
                        </td>
                        <td class="col-data-content py-1" style=" font-size: 13px">{{ aluno.classificacao
                            }}
                        </td>
                        <td class="col-acoes py-1">
                            <button (click)=" imodo=1; modalAluno.show(); loadAluno(aluno) " type="button"
                                class="btn btn-icon btn-outline-info p-1 mt-0 mb-0 mx-2"
                                [style]="{'height': '25px', 'width': '25px'} " [placement]="'top'"
                                ngbTooltip="Transferência">
                                <i class="pi pi-chevron-up"></i>
                            </button>

                            <button (click)="exclusaoAluno(aluno)" type="button"
                                class="btn btn-icon btn-outline-danger p-1 mt-0 mb-0"
                                [style]="{'height': '25px', 'width': '25px'} " [placement]="'top'" ngbTooltip="Excluir">
                                <i class="pi pi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </app-card>

    <!-- MODAL CLASSES INICIO -->
    <form [formGroup]="alunoForm" autocomplete="off" (submit)="submitForm()">
        <div class="col-sm-12">
            <app-ui-modal #modalAluno [dialogClass]="'modal-lg'">
                <div class="app-modal-header ">
                    <div class="card px-3 "
                        style="width: 46rem; height: 1rem; background: #fcfdfd; padding-bottom: 10px; padding-top: 5px">
                        <nav aria-label="breadcrumb" class=" mb-4 ">
                            <div class="card mb-0 px-3  py-1 "
                                style="background-color: rgb(77, 83, 90); border-radius: 5px">
                                <span class=" text-white py-0  " style="font-size: 18px; ">{{ pageTitle
                                    }}</span>
                            </div>
                        </nav>
                    </div>
                </div>

                <div class="app-modal-body">

                    <!-- Modal Body Inicio -->
                    <div class="row ml-2 mr-2">

                        <!-- Nome Classe-->
                        @if(imodo===0){
                        <div class="form-group col-md-6 ">
                            <label class="">Classe</label>
                            <p-select (onChange)="onChangeClasse($event)" formControlName="classeId" [options]="classes"
                                [editable]="false" [filter]="true" filterBy="nome" [showClear]="false"
                                optionLabel="nome" resetFilterOnHide="true" dropdownIcon="pi pi-users" optionValue="id"
                                [autofocus]="false" placeholder="Selecione uma classe" />
                        </div>
                        }

                        <!-- Nome Aluno Transferencia-->
                        @if(imodo===1){
                        <div class="form-group col-md-6 ">
                            <label class="">Aluno</label>
                            <input readonly type="text" class=" form-control " style="background: rgb(238, 236, 236);"
                                formControlName="nome">
                        </div>
                        }

                        <!-- Nome Aluno -->
                        @if(imodo===0){
                        <div class="form-group col-md-6 ">
                            <label class="">Aluno</label>
                            <p-select [disabled]="imodo === 1" (onChange)="onChangeAluno($event)"
                                formControlName="pessoaId" [options]="pessoas" [editable]="false" [filter]="true"
                                filterBy="nome" [showClear]="false" optionLabel="nome" resetFilterOnHide="true"
                                dropdownIcon="pi pi-users" optionValue="id" [autofocus]="false"
                                placeholder="Selecione um aluno" />
                        </div>
                        }

                        <!-- Nome Classe  transferencia-->
                        @if(imodo===1){
                        <div class="form-group col-md-6 ">
                            <label class="">Transferir para Classe</label>
                            <p-select (onChange)="onChangeClasse($event)" formControlName="classeId" [options]="classes"
                                [editable]="false" [filter]="true" filterBy="nome" [showClear]="false"
                                optionLabel="nome" resetFilterOnHide="true" dropdownIcon="pi pi-users" optionValue="id"
                                [autofocus]="false" placeholder="Selecione uma classe" />
                        </div>
                        }

                        <!-- Classificaçao -->
                        @if(imodo===0){
                        <div class="form-group col-md-4 ">
                            <label for="rg">Classificação</label>
                            <input readonly type="text" class=" form-control " style="background: rgb(238, 236, 236);"
                                formControlName="classificacao">
                        </div>
                        }
                        <!-- Status -->
                        @if(imodo===0){
                        <div class="form-group col-md-4">
                            <label>Status</label>
                            <p-select class="w-full md  mb-2" formControlName="status" [options]="status"
                                [editable]="false" [filter]="false" filterBy="nome" [showClear]="false"
                                optionLabel="nome" resetFilterOnHide="true" dropdownIcon="pi pi-chevron-down"
                                [autofocus]="false" optionValue="nome" placeholder="Selecione um status">
                            </p-select>
                        </div>
                        }
                        <!-- Faixa Etária -->
                        @if(imodo===0){
                        <div class="form-group col-md-4">
                            <label for="dataSeparacao">Faixa Etária</label>
                            <input type="text" class="form-control" formControlName="faixaEtaria">
                        </div>
                        }

                    </div>

                    <!-- Footer Modal  Footer Modal  Footer Modal  Footer Modal  Footer Modal  Footer Modal  Footer Modal  Footer Modal  -->
                    <div class="modal-footer" style="padding-top: 10px;">

                        <!-- Botões Inicio-->

                        <span class="float-end ">
                            <p-button (click)="modalAluno.hide(); resetModal()" routerLink="/alunos"
                                icon='pi pi-chevron-left' [style]="{'height':'30px', 'margin-left':'10px'}" size="small"
                                severity="info" label="Fechar" class=" " />
                        </span>

                        <span class="float-end ml-4">
                            <p-button (click)="modalAluno.hide();" severity="success" [disabled]="alunoForm.invalid"
                                type="submit" class="mr-4"
                                [style]="{'height':'30px', 'margin-left':'10px', 'background':'#388669'}" size="small"
                                label="Salvar" icon='pi pi-check' />
                        </span>
                        <!-- Botões Fim-->

                    </div>
                    <!-- <div class="form-group "></div>
                    <pre> {{alunoForm.value | json}} </pre> -->
                </div>
            </app-ui-modal>
        </div>
    </form>
    <!-- MODAL CLASSES FIM -->

</section>
<!--  ativo e inativo body end -->
