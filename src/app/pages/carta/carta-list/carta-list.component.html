<div class="section-body" style="background: #f6f7f8;">
  <div class="row " style="margin-left: 0px; margin-right: 0px;">
    <div class="col-12 col-md-12 col-lg-12 card-border-c-green border-1">
      <div class="card-body ">
        <div class="row shadow mb-3 px-3">
          <div class="form-group col-md-4 mt-2">
            <label class="text-dark m-t-0 mb-1"> Pesquisa</label>
            <p-inputgroup>
              <button type="button" class=""
                style="height: 30px; cursor:default ; border-radius: 6px; border-bottom-right-radius: 0; border-top-right-radius: 0; border: 0; background: #1a82ce   ;"
                pButton pRipple> <i class="pi pi-search"></i></button>
              <input class="form-control" [(ngModel)]="nome" type="text" [ngModelOptions]="{standalone: true}"
                placeholder="Pesquisar Nome ou Sobrenome"
                (input)="dtcarta.filterGlobal($event.target?.addEventListener, 'contains')"
                style="height: 30px; font-size: 12px; text-transform: uppercase ; border-bottom-left-radius: 0; border-top-left-radius: 0;">
            </p-inputgroup>
          </div>

          <span class="form-group col-md-8 mt-4">
            <p-button routerLink="new" type="button" severity="success" class="float-end" label="Nova Carta"
              [style]="{'height':'30px', 'background':'#388669'}" size="small" icon="pi pi-envelope" />

          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Fim ToolBar -->

<app-card [hidHeader]="true" cardTitle="" cardClass="card-border-c-green shadow  border-1">
  <div class="p-0">
    <p-table #dtcarta [value]="cartas" responsiveLayout="stack"
      [globalFilterFields]="['nomeSemAcento','cpfOuCnpj','tipoMembro','situacaoCadastral']" [lazy]="true"
      (onLazyLoad)="loadCartasLazy($event)" [showCurrentPageReport]="true" [totalRecords]="totalRegistros" showGridlines
      stripedRows [rowsPerPageOptions]="[8, 15, 30]"
      currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros" [paginator]="true"
      [rows]="linesPerPage" emptyMessage="Nenhum registro encontrado">

      <ng-template #header>
        <tr>
          <th
            style=" background:  rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-left-radius: 5px; ">
            Nome</th>

          <th class="col-data-content-4" style="background:  rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 5px; padding-bottom: 5px;
               ">Congregção Destino</th>

          <th class="col-data-150" style="background:  rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 5px; padding-bottom: 5px;
               ">Tipo carta</th>

          <th style="background:  rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 5px; padding-bottom: 5px;
              " class="col-date">Data emissão</th>

          <th style="background:  rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 5px; padding-bottom: 5px;
              " class="col-date">Data
            validade</th>
          <th style="min-width:7rem; background: rgb(77, 83, 90);  font-size: 12px ;color: aliceblue;  padding-top: 6px; padding-bottom: 6px;
           border-top-right-radius: 5px" class="col-acoes-header">Ações</th>

        </tr>
      </ng-template>

      <ng-template #body let-carta>
        <tr>

          <td [routerLink]="[carta.id, 'edit']" style="cursor: pointer; font-size: 12px; color: rgb(6, 6, 6);">{{
            carta.nomeMembro }}</td>

          <td class="col-data-content-4" [routerLink]="[carta.id, 'edit']" class="col-data-150"
            style="cursor: pointer; font-size: 12px; color: rgb(6, 6, 6);">{{ carta.congregacaoDestino }}</td>

          <td [routerLink]="[carta.id, 'edit']" class="col-data-150"
            style="cursor: pointer; font-size: 12px; color: rgb(6, 6, 6);"
            [style.color]="(carta.tipoCarta === 'Mudança') ? 'red' : (carta.tipoCarta === 'Recomendação') ? 'green' : (carta.tipoCarta === 'Mudança Fora de Comunhão') ? 'orange': 'black'">
            {{ carta.tipoCarta }}</td>

          <td [routerLink]="[carta.id, 'edit']" style="font-size: 12px; color: rgb(6, 6, 6);" class="col-date">{{
            carta.dataEmissao }}
          </td>

          <td [routerLink]="[carta.id, 'edit']" style="font-size: 12px; color: rgb(6, 6, 6);" class="col-date">{{
            carta.dataValidade
            }}</td>

          <td class="col-acoes">
            <button [routerLink]="[carta.id, 'edit']" type="button"
              class="btn btn-icon btn-outline-success p-1 mb-0 mt-0"
              [style]="{'height': '30px', 'width': '30px', 'margin-left': '10px'} " [placement]="'top'"
              ngbTooltip="Editar">
              <i class="pi pi-pencil "></i>
            </button>

          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-card>
