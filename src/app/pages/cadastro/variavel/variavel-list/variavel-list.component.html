<!-- Cards Estaticticas -->
<div class="row mb-0">
  <div class="col-xl-12 col-md-12 ">
    <div class="card card-border-c-blue border-1  ">
      <div class="row align-items-center m-l-0">
        <div class="col-auto">
          <i class="fas fa-cogs f-24 text-c-blue"></i>
        </div>
        <div class="col-auto ">
          <h6 class="text-dark  mt-2">Total de Variáveis</h6>
          <h4>{{ totalRegistros }}</h4>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Fim Cards Estaticticas -->


<!-- Pesquisa  -->
<div class="row mb-2">
  <span class=" col-sm-4 mt-0 mb-2">
    <p-inputgroup>
      <button type="button" style="height: 30px; cursor:default ; border-radius: 6px; border-bottom-right-radius:0;
               border-top-right-radius: 0; border: 0; background:#1a82ce;" pButton pRipple class=""> <i
          class="pi pi-search"></i></button>
      <input pInputText class="form-control " placeholder="Pesquisar Nome" [(ngModel)]="variavel" type="text"
        [ngModelOptions]="{standalone: true}"
        (input)="dtvariavel.filterGlobal($event.target?.addEventListener, 'contains')" style="height: 30px; min-width: 180px; border-radius: 6px; border-bottom-left-radius: 0; 
              border-top-left-radius: 0; font-size: 14px; text-transform: lowercase">
    </p-inputgroup>
  </span>

  <!--Fim pesquisa Variavel  -->

  <span class="col-sm-8 ">
    <p-button routerLink="new" type="button" severity="success" class="float-end" label="Novo"
      [style]="{'height':'30px', 'background':'#388669'}" size="small" icon="pi pi-check" />
  </span>
</div>


<app-card [hidHeader]="true" cardTitle="" cardClass="card-border-c-blue shadow  border-1">
  <div class="p-0">
    <p-table #dtvariavel [value]="variaveis"
      [globalFilterFields]="['nome', 'country.name', 'representative.name', 'status']" [lazy]="true"
      responsiveLayout="stack" (onLazyLoad)="loadVariavelLazy($event)" [showCurrentPageReport]="true"
      [totalRecords]="totalRegistros" showGridlines stripedRows
      currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros" [paginator]="true"
      [rows]="linesPerPage" emptyMessage="Nenhum registro encontrado">


      <ng-template pTemplate="header">
        <tr>
          <th class="col-data-content-4"
            style="background: rgb(77, 83, 90); font-size: 13px ;color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-left-radius: 5px;">
            <b>Código</b>
          </th>
          <th class="col-data-content-4"
            style="background: rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 6px; padding-bottom: 6px">
            <b>nome</b>
          </th>
          <th class="col-data-content-4"
            style="background: rgb(77, 83, 90); font-size: 12px ;color: aliceblue; padding-top: 6px; padding-bottom: 6px">
            <b>Local</b>
          </th>

          <th class="col-acoes-header"
            style="font-size: 13px; background-color: rgb(77, 83, 90); color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-right-radius: 5px;">
            Ações</th>

        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-variavel>
        <tr>
          <td class="col-data-content-3" style=" cursor: pointer; font-size: 13px; min-width: 200px;">{{ variavel.variavel }}
          <td class="col-data-content-3" style=" cursor: pointer; font-size: 13px; min-width: 200px;">{{ variavel.nome
            }}
          <td class="col-data-content-3" style=" cursor: pointer; font-size: 13px; min-width: 200px;">{{ variavel.local
            }}
          </td>
          <td class="col-acoes-header">
            <p-button [routerLink]="[variavel.id, 'edit']" type="button" icon="pi pi-pencil"
              styleClass="p-button-sm  p-button-outlined" [style]="{'height': '30px', 'width': '30px'} "
              ngbTooltip="Editar">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-card>
