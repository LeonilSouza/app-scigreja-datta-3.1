<!-- Cards Estaticticas -->
<section class="main-content">
   <div class="row mb-0 ">
        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
            <div class="card card-border-c-purple border-1  ">
                <div class="row align-items-center m-l-0">
                    <div class="col-auto">
                        <i class="fas fa-book-reader f-28 text-c-purple"></i>
                    </div>
                    <div class="col-auto">
                        <h6 class="text-dark mt-2">Total de Tipo de falta</h6>
                        <h4 class="f-16">{{ totalRegistros }}</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Fim Cards Estaticticas -->

    <!-- Pesquisa Tipo Falta -->
    <div class="row mb-2">
        <span class=" col-sm-4 mt-0 mb-2">
            <p-inputgroup>
                <button type="button" class=""
                    style="height: 30px; cursor:default ; border-radius: 6px; border-bottom-right-radius: 0; border-top-right-radius: 0; border: 0; background: #1a82ce   ;"
                    pButton pRipple> <i class="pi pi-search"></i></button>
                <input class="form-control" [(ngModel)]="nome" type="text" [ngModelOptions]="{standalone: true}"
                    placeholder="Pesquisar Nome"
                    (input)="dttipoFalta.filterGlobal($event.target?.addEventListener, 'contains')"
                    style="height: 30px; font-size: 12px; text-transform: uppercase ; border-bottom-left-radius: 0; border-top-left-radius: 0;">
            </p-inputgroup>
        </span>

        <!--Fim pesquisa   -->

        <span class="col-sm-8 ">
            <p-button routerLink="new" type="button"severity="success" class="float-end" label="Novo" [style]="{'height':'30px', 'background':'#388669'}"
                size="small" icon="pi pi-check" />
        </span>

    </div>

    <app-card [hidHeader]="true" cardTitle="" cardClass="card-border-c-purple shadow  border-1">
        <div class="p-0">
            <p-table #dttipoFalta [value]="tipoFaltas" [globalFilterFields]="['nome']" [lazy]="true" responsiveLayout="stack"
                (onLazyLoad)="loadTipoFaltasLazy($event)" [showCurrentPageReport]="true" [totalRecords]="totalRegistros"
                showGridlines stripedRows
                currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros" [paginator]="true"
                [rows]="linesPerPage" emptyMessage="Nenhum registro encontrado">


                <ng-template #header>
                    <tr>
                        <th class="col-data-100"
                            style="background: rgb(77, 83, 90); font-size: 13px ;color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-left-radius: 5px;">
                            <b>Código</b>
                        </th>
                        <th
                            style="font-size: 13px; background-color:rgb(77, 83, 90); color: aliceblue; padding-top: 6px; padding-bottom: 6px;">
                            <b>Nome</b>
                        </th>
                        <th class="col-acoes-header"
                            style="font-size: 13px; background-color: rgb(77, 83, 90); color: aliceblue; padding-top: 6px; padding-bottom: 6px; border-top-right-radius: 5px;">
                            Ações</th>

                    </tr>
                </ng-template>

                <ng-template #body let-tipo>
                    @if(perfil !== 'ADMIN' && (tipo.igrejaId == igrejaId ||
                    tipo.igrejaId == null)){
                    <tr>
                        <td class="col-data-100 py-1" style=" font-size: 13px">{{ tipo.id }}
                        </td>
                        <td class="py-1" style=" font-size: 13px">{{ tipo.nome }}</td>
                        <td class="col-acoes-header py-1">

                            @if(perfil !== 'ADMIN' && (tipo.igrejaId == igrejaId )){
                            <button [routerLink]="[tipo.id, 'edit']" type="button"
                                class="btn btn-icon btn-outline-success p-1"
                                [style]="{'height': '25px', 'width': '25px'} ">
                                <i class="pi pi-pencil"></i>
                            </button>
                            }
                        </td>
                    </tr>
                    }

                    @if(perfil == 'ADMIN'){
                    <tr>
                        <td class="col-data-100 py-1" style=" font-size: 13px">{{ tipo.id }}
                        </td>
                        <td class="py-1" style=" font-size: 13px;">{{ tipo.nome }}<br>
                        </td>
                        <td class="col-acoes-header py-1">
                            <button [routerLink]="[tipo.id, 'edit']" type="button"
                                class="btn btn-icon btn-outline-info p-1 mt-0 mb-0"
                                [style]="{'height': '25px', 'width': '25px'} ">
                                <i class="pi pi-chevron-up"></i>
                            </button>
                        </td>
                    </tr>
                    }
                </ng-template>
            </p-table>
        </div>
    </app-card>
</section>
<!--  ativo e inativo body end -->
