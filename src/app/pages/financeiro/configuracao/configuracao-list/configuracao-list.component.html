<!-- Cards Estaticticas -->
<div class="row mb-0">
  <div class="col-xl-6 col-md-6">
      <app-card [hidHeader]="true" cardClass="card-border-c-green shadow mb-3">
          <div class="row align-items-center m-l-0">
              <div class="col-auto">
                  <i class="fas fa-book-reader f-28 text-c-purple"></i>
              </div>
              <div class="col-auto">
                  <h6 class="text-muted m-b-10">Configuracões padrão</h6>
                  <h3 class="m-b-0">10</h3>
              </div>
          </div>
      </app-card>
  </div>

  <div class="col-xl-6 col-md-6">
      <app-card [hidHeader]="true" cardClass="card-border-c-blue shadow mb-3">
          <div class="row align-items-center m-l-0">
              <div class="col-auto">
                  <i class="fas fa-home f-28 text-c-dark"></i>
              </div>
              <div class="col-auto">
                  <h6 class="text-muted m-b-10">Configuracoes da Igreja</h6>
                  <h3 class="m-b-0">20</h3>
              </div>
          </div>
      </app-card>
  </div>
</div>
<!-- Fim Cards Estaticticas -->

<!-- Pesquisa Configuracoes -->

<app-card [hidHeader]="true" cardTitle="" cardClass="shadow">

  <div class="row">
      <div class="col-sm-12">
          <div class="">
              <div class="mb-3 ">
                  <div class="">
                      <p-table #dtdisciplina [value]="configuracoes" [globalFilterFields]="['nome']" [lazy]="true"
                      responsiveLayout="stack" (onLazyLoad)="loadDisciplinasLazy($event)" [showCurrentPageReport]="true"
                          [totalRecords]="totalRegistros"
                          styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines"
                          currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} registros"
                          [paginator]="true" [rows]="linesPerPage" emptyMessage="Nenhum registro encontrado">


                          <ng-template pTemplate="header">
                              <tr>
                                  <th class="col-data-100"
                                      style="background: rgb(77, 83, 90); font-size: 13px ;color: aliceblue;">
                                      <b>Código</b>
                                  </th>
                                  <th style="font-size: 13px; background-color:rgb(77, 83, 90); color: aliceblue;">
                                      <b>Nome</b>
                                  </th>
                                  <th class="col-acoes-header"
                                      style="font-size: 13px; background-color: rgb(77, 83, 90); color: aliceblue;">
                                      Ações</th>

                              </tr>
                          </ng-template>

                          <ng-template pTemplate="body" let-configuracao>
                              <tr
                                  *ngIf="(perfil !== 'ADMIN' && (configuracao.igrejaId == igrejaId || configuracao.igrejaId == null))">
                                  <td class="col-data-100" style=" font-size: 13px">{{ configuracao.id }}</td>
                                  <td style=" font-size: 13px">{{ configuracao.nome }}</td>
                                  <td class="col-acoes-header">
                                      <button *ngIf="(perfil !== 'ADMIN' && (configuracao.igrejaId == igrejaId ))"
                                          [routerLink]="[configuracao.id, 'edit']" type="button"
                                          class="btn btn-icon btn-outline-success p-1"
                                          [style]="{'height': '30px', 'width': '30px'} " [placement]="'top'"
                                          ngbTooltip="Editar">
                                          <i class="pi pi-pencil"></i>
                                      </button>
                                  </td>
                              </tr>

                              <tr *ngIf="(perfil == 'ADMIN')">
                                  <td class="col-data-100" style=" font-size: 13px">{{ configuracao.id }}</td>
                                  <td style=" font-size: 13px;">{{ configuracao.nome }}<br>
                                  </td>
                                  <td class="col-acoes-header">
                                      <button [routerLink]="[configuracao.id, 'edit']" type="button"
                                          class="btn btn-icon btn-outline-success p-1"
                                          [style]="{'height': '30px', 'width': '30px'} " [placement]="'top'"
                                          ngbTooltip="Editar">
                                          <i class="pi pi-chevron-up"></i>
                                      </button>
                                  </td>
                              </tr>
                          </ng-template>
                      </p-table>
                  </div>
              </div>
          </div>
      </div>
  </div>
</app-card>
<!--  ativo e inativo body end -->
